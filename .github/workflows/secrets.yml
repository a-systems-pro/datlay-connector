name: secrets

# 426 D13 and D16: no secret enters this repository. Every push of a branch or a tag and every pull request, never
# cancelled, scans exactly the commits it brings. gitleaks is fetched at a pinned version and checked against its
# published SHA-256, the same as the platform's. This CI holds no secret and never runs on pull_request_target.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks at its pinned version
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
          ./gitleaks version

      - name: No inline allow
        run: |
          # the comment that silences gitleaks on its line
          if git grep -nE '(//|#|/\*|<!--)[[:space:]]*gitleaks:allow' -- ':!.github/workflows/secrets.yml'; then
            echo "::error::an inline gitleaks:allow"; exit 1
          fi

      - name: The commits this event brings
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE..$HEAD"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            range="$BEFORE..$SHA"
          else
            # a new branch or tag, or a run by hand: everything it holds
            range="$SHA"
          fi
          echo "scanning $range"
          ./gitleaks git . --no-banner --redact --log-opts="$range"
